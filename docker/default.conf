# `sendfile off` avoids nginx's default `aio on`, which calls io_setup() -- a Linux AIO
# syscall not available on Colima/macOS kernels (same workaround Gazelle already applies
# to the legacy ph-ee-operations-web image's nginx config).
server {
    listen       80;
    server_name  localhost;
    root   /usr/share/nginx/html;
    index  index.html;

    sendfile off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html and env-config.js must always be revalidated -- env-config.js carries the
    # per-deployment runtime config, and a stale cached index.html would keep pointing at
    # an old JS bundle.
    location ~* (index\.html|env-config\.js)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
